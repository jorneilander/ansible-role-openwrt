---
- name: "ssh_add_keys | Add public key"
  community.openwrt.lineinfile:
    path: "{{ openwrt_dropbear_authorized_keys_path }}"
    create: true
    line: "{{ openwrt_ssh_public_key }}"
    owner: "root"
    group: "root"
    mode: "u=rw,g=,o="
