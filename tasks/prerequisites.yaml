---
- name: "prerequisites | Install role community.openwrt.init"
  community.general.ansible_galaxy_install:
    type: "collection"
    name: "community.openwrt"
  delegate_to: localhost

- name: "prerequisites | Apply community.openwrt.init role"
  ansible.builtin.import_role:
    name: "community.openwrt.init"

- name: "prerequisites | Gather OpenWrt facts"
  community.openwrt.setup:

- name: "prerequisites | Fail on opkg package manager"
  ansible.builtin.fail:
    msg: |
      This role does not support OpenWrt devices using the opkg package manager.
  when: openwrt_package_manager == "opkg"
